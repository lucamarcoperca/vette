<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vette">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1211" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232fbf9f'/%3E%3Cpath d='M4 19 10 8l3.5 5 1.8-2.6L20 19Z' fill='none' stroke='%230a1f1c' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Vette in progetto</title>
<style>
:root{--bg:#f3f5f4;--text:#121816;--muted:#6c7773;--mint:#2fbf9f;--btn:#e85a24;--on-btn:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#0e1211;--text:#eef3f1;--muted:#8c9893;--mint:#45d1b0;--btn:#ff8a5c;--on-btn:#1a0d07;color-scheme:dark}}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
.dot{width:46px;height:46px;border-radius:14px;background:var(--mint);margin:0 auto 14px;animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{opacity:.45;transform:scale(.92)}}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}
p{margin:0;color:var(--muted)}
button{margin-top:16px;font:inherit;font-weight:700;border:0;border-radius:11px;padding:11px 18px;background:var(--btn);color:var(--on-btn);cursor:pointer}
</style>
</head>
<body>
<div id="box"><div class="dot"></div><p id="msg">Carico le vette…</p></div>
<script>
/* Contenitore: questo file non va più modificato.
   La pagina vera (grafica e funzioni) è salvata nel database Supabase, tabella app_code. */
(function(){
  var URL = "https://afptwvzsjfmujxfvybjv.supabase.co/rest/v1/app_code?id=eq.main&select=html";
  var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmcHR3dnpzamZtdWp4ZnZ5Ymp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3Mzg0MjAsImV4cCI6MjEwOTMxNDQyMH0.rgWCi9m-VYXxJalkt5VgWpjF-WhXIsbJBw2WTdpYDmQ";
  var CACHE = "vette-app-html";
  function show(html){ document.open(); document.write(html); document.close(); }
  function fail(){
    var cached = null; try{ cached = localStorage.getItem(CACHE); }catch(e){}
    if (cached){ show(cached); return; }
    document.getElementById("box").innerHTML = '<p>Non riesco a caricare il sito. Controlla la connessione e riprova.</p><button onclick="location.reload()">Riprova</button>';
  }
  var ctrl = window.AbortController ? new AbortController() : null;
  var timer = setTimeout(function(){ if (ctrl) ctrl.abort(); }, 10000);
  fetch(URL, { headers:{ apikey:KEY, Authorization:"Bearer " + KEY }, cache:"no-store", signal: ctrl ? ctrl.signal : undefined })
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(rows){
      clearTimeout(timer);
      var html = rows && rows[0] && rows[0].html;
      if (!html) throw new Error("vuoto");
      try{ localStorage.setItem(CACHE, html); }catch(e){}
      show(html);
    })
    .catch(function(){ clearTimeout(timer); fail(); });
})();
</script>
</body>
</html>
