<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vette">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0f1514">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232fbf9f'/%3E%3Cpath d='M4 19 10 8l3.5 5 1.8-2.6L20 19Z' fill='none' stroke='%230a1f1c' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Vette in progetto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: barra scura fissa in alto, contenuto centrato a 1080px; Vette = griglia di schede-promemoria, Calendario = mese + colonna "in programma" */
:root{
  --bg:#f3f5f4; --card:#ffffff; --card-2:#f2f5f4; --line:#e2e8e5;
  --text:#121816; --muted:#6c7773; --soft:#b2bcb8;
  --pine:#0f3d3a; --pine-2:#0a2e2c; --pine-soft:#d9f2ec; --on-pine:#ffffff;
  --mint:#2fbf9f; --on-mint:#0a1f1c;
  --sun:#e85a24; --sun-soft:#ffe6dc; --on-sun:#ffffff;
  --blue:#4f5be0; --blue-soft:#e6e8fe;
  --danger:#c93a30; --danger-soft:#fde0de;
  --bar:#0f1514; --on-bar:#ffffff; --bar-muted:rgba(255,255,255,.62); --bar-line:rgba(255,255,255,.16);
  --hero-a:#0f3d3a; --hero-b:#1f6b5f; --on-hero:#ffffff;
  --scrim:rgba(10,20,18,.38);
  --shadow:0 1px 2px rgba(18,24,22,.04), 0 4px 14px rgba(18,24,22,.05);
  --f-display:"Space Grotesk",Inter,system-ui,sans-serif;
  --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1211; --card:#161c1b; --card-2:#1d2523; --line:#28322f;
    --text:#eef3f1; --muted:#8c9893; --soft:#55615c;
    --pine:#7fe0c8; --pine-2:#a1ead8; --pine-soft:#173430; --on-pine:#0a1f1c;
    --mint:#45d1b0; --on-mint:#0a1f1c;
    --sun:#ff8a5c; --sun-soft:#3a2219; --on-sun:#1a0d07;
    --blue:#9aa3ff; --blue-soft:#23264a;
    --danger:#ff8076; --danger-soft:#3b1f1e;
    --bar:#080b0a; --on-bar:#ffffff; --bar-muted:rgba(255,255,255,.6); --bar-line:rgba(255,255,255,.14);
    --hero-a:#0b201e; --hero-b:#1a5a50; --on-hero:#eef3f1;
    --scrim:rgba(0,0,0,.55);
    --shadow:0 6px 20px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1211; --card:#161c1b; --card-2:#1d2523; --line:#28322f;
  --text:#eef3f1; --muted:#8c9893; --soft:#55615c;
  --pine:#7fe0c8; --pine-2:#a1ead8; --pine-soft:#173430; --on-pine:#0a1f1c;
  --mint:#45d1b0; --on-mint:#0a1f1c;
  --sun:#ff8a5c; --sun-soft:#3a2219; --on-sun:#1a0d07;
  --blue:#9aa3ff; --blue-soft:#23264a;
  --danger:#ff8076; --danger-soft:#3b1f1e;
  --bar:#080b0a; --on-bar:#ffffff; --bar-muted:rgba(255,255,255,.6); --bar-line:rgba(255,255,255,.14);
  --hero-a:#0b201e; --hero-b:#1a5a50; --on-hero:#eef3f1;
  --scrim:rgba(0,0,0,.55);
  --shadow:0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none !important}
body{background:var(--bg);color:var(--text);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

/* barra */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bar);color:var(--on-bar)}
.hdr-in{max-width:1080px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:16px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--mint);color:var(--on-mint);display:grid;place-items:center;flex:none}
.tabs{margin-left:auto;margin-right:auto;display:flex;gap:2px}
.tabs a{position:relative;display:flex;align-items:center;gap:8px;padding:10px 16px;color:var(--bar-muted);text-decoration:none;font-weight:600;font-size:14.5px;border-radius:10px;transition:color .2s,background .2s}
.tabs a:hover{color:var(--on-bar);background:var(--bar-line)}
.tabs a.active{color:var(--on-bar)}
.tabs a.active::after{content:"";position:absolute;left:16px;right:16px;bottom:-10px;height:3px;border-radius:3px 3px 0 0;background:var(--sun)}
.sync{flex:none;display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--bar-muted);width:38px;justify-content:flex-end}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--soft)}
.sync.live i{background:var(--mint);box-shadow:0 0 0 3px rgba(47,191,159,.25)}
.sync.local i{background:var(--sun)}
@media (min-width:701px){.sync{width:auto}}
@media (max-width:700px){.sync span{display:none}}

main{max-width:1080px;margin:0 auto;padding-block:36px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{animation:fade .3s ease}
.page[hidden]{display:none !important}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-head{margin-bottom:22px}
.page-head h1{font-size:42px;font-weight:700;line-height:1.05}
.page-head p{margin:6px 0 0;color:var(--muted)}
@media (max-width:700px){main{padding-block:22px 60px}.page-head h1{font-size:32px}}
.tile{display:inline-flex;flex-direction:column;margin-top:18px;min-width:130px;background:var(--pine);color:var(--on-pine);border-radius:14px;padding:12px 16px;font-size:12.5px;font-weight:600;opacity:.95}
.tile b{font-family:var(--f-display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}

/* card e pulsanti */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:11px;font-weight:700;font-size:14.5px;transition:background .15s,transform .15s}
.btn.primary{background:var(--sun);color:var(--on-sun)}
.btn.primary:hover{transform:translateY(-1px)}
.btn.soft{background:var(--card-2);color:var(--text)}
.btn.soft:hover{background:var(--line)}
.btn.danger{color:var(--danger)}
.btn.danger:hover,.btn.danger.armed{background:var(--danger-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* form */
.add{padding:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.add .name{flex:1 1 220px;min-width:0;border:2px solid transparent;background:transparent;border-radius:10px;padding:11px 12px;font-size:16px;font-weight:600;outline:none}
.add .name:focus{background:var(--card-2)}
.add .name::placeholder{color:var(--soft)}
.specs{display:flex;gap:6px;flex-wrap:wrap}
.field{display:flex;align-items:center;gap:6px;background:var(--card-2);border-radius:10px;padding:6px 10px;border:2px solid transparent}
.field:focus-within{border-color:var(--mint);background:var(--card)}
.field label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input{border:none;background:transparent;outline:none;width:56px;font-weight:700;padding:4px 0;-moz-appearance:textfield;font-variant-numeric:tabular-nums;min-width:0}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field span{font-size:13px;color:var(--muted)}
@media (max-width:760px){
  .add .specs{flex:1 1 100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .add .specs .field{min-width:0;flex-wrap:wrap;gap:0 4px;padding:6px 10px}
  .add .specs .field label{width:100%;font-size:10.5px}
  .add .specs .field input{flex:1 1 0;width:auto;min-width:0}
  .add .btn{flex:1 1 100%}
}

/* vette */
.tasks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:820px){.tasks{grid-template-columns:1fr}}
.task{padding:16px;transition:border-color .2s}
.task:hover{border-color:var(--soft)}
.task.open{grid-column:1/-1;border-color:var(--mint)}
.task.done{background:var(--card-2);box-shadow:none}
.task-main{display:flex;align-items:center;gap:14px}
.check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--soft);display:grid;place-items:center;transition:background .2s,border-color .2s;color:var(--on-mint)}
.check:hover{border-color:var(--mint);background:var(--pine-soft)}
.check svg{opacity:0;transform:scale(.5);transition:.2s}
.task.done .check{background:var(--mint);border-color:var(--mint)}
.task.done .check svg{opacity:1;transform:none}
.task-body{flex:1;min-width:0;cursor:pointer}
.task-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--f-display);font-weight:700;font-size:17px}
.task-title .t{min-width:0;overflow-wrap:anywhere}
.task.done .task-title .t{text-decoration:line-through;color:var(--muted)}
.quota{font-family:var(--f-body);font-size:12.5px;font-weight:700;background:var(--text);color:var(--card);padding:2px 9px;border-radius:7px;font-variant-numeric:tabular-nums}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:7px;background:var(--card-2);color:var(--muted);font-variant-numeric:tabular-nums}
.pill.up{background:var(--sun-soft);color:var(--sun)}
.pill.km{background:var(--blue-soft);color:var(--blue)}
.pill.date{background:var(--pine-soft);color:var(--pine)}
.task.done .pills,.task.done .quota,.task.done .note-preview{opacity:.55}
.note-preview{color:var(--muted);font-size:14px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task.open .note-preview{display:none}
.chev{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.chev:hover{background:var(--card-2)}
.chev svg{transition:transform .2s}
.task.open .chev svg{transform:rotate(180deg)}
.task-edit{display:none;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.task.open .task-edit{display:block}
.edit-grid{display:flex;gap:8px;flex-wrap:wrap}
.edit-grid .wide{flex:1 1 220px}
.edit-grid .wide input{width:100%}
.task-edit textarea{display:block;width:100%;margin-top:10px;border:2px solid transparent;background:var(--card-2);border-radius:12px;padding:12px 14px;min-height:80px;resize:vertical;outline:none;line-height:1.5}
.task-edit textarea:focus{border-color:var(--mint);background:var(--card)}
.task-edit textarea::placeholder{color:var(--soft)}
.edit-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.edit-actions .spacer{flex:1}
.empty{grid-column:1/-1;text-align:center;padding:36px 20px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:16px}
.empty b{display:block;color:var(--text);font-family:var(--f-display);font-size:19px;margin-bottom:4px}

/* calendario */
.cal-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
@media (max-width:1000px){.cal-layout{grid-template-columns:1fr}}
.cal{padding:20px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.cal-head h2{font-size:24px;text-transform:capitalize}
.cal-nav{display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:10px;background:var(--card-2);border:1px solid var(--line);display:grid;place-items:center}
.icon-btn:hover{background:var(--line)}
.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0 4px}
.weekdays div{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:0 0 8px 8px}
.weekdays div:nth-child(n+6){color:var(--mint)}
.day{min-height:96px;border-top:1px solid var(--line);padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;overflow:hidden;min-width:0;transition:background .15s}
.day:hover{background:var(--card-2)}
.day.weekend{background:color-mix(in srgb,var(--pine-soft) 50%,transparent)}
.day.out{opacity:.35}
.day .n{font-size:13px;font-weight:700;color:var(--muted);width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.day.today .n{background:var(--sun);color:var(--on-sun)}
.ev{font-size:12px;font-weight:700;border-radius:6px;padding:3px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--pine);color:var(--on-pine)}
.ev.done{background:var(--card);color:var(--muted);text-decoration:line-through;border:1px solid var(--line)}
.day.past:not(.today) .ev{opacity:.6}
@media (max-width:620px){
  .cal{padding:14px}
  .day{min-height:58px;padding:4px}
  .day .n{font-size:12px;width:22px;height:22px}
  .ev{font-size:0;height:7px;padding:0;border-radius:4px}
  .weekdays div{padding-left:4px}
}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.side .card{padding:18px}
.side h3{font-size:17px;margin-bottom:10px}
.next-hero{background:linear-gradient(150deg,var(--hero-a),var(--hero-b));color:var(--on-hero);border:none;position:relative;overflow:hidden;cursor:pointer}
.next-hero small{opacity:.8;font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:11.5px}
.next-hero .big{font-family:var(--f-display);font-size:24px;line-height:1.15;margin:6px 0 4px;font-weight:700}
.next-hero .when{font-weight:600;opacity:.9}
.next-hero .countdown{display:inline-block;margin-top:12px;background:rgba(255,255,255,.18);padding:4px 12px;border-radius:999px;font-weight:700;font-size:13px}
.next-hero svg{position:absolute;right:-10px;bottom:-6px;opacity:.16}
.up{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:12px;cursor:pointer}
.up:hover{background:var(--card-2)}
.up .d{width:44px;height:48px;flex:none;border-radius:12px;background:var(--card-2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.up .d b{font-size:17px;font-variant-numeric:tabular-nums}
.up .d small{font-size:10.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:3px}
.up .i{min-width:0}
.up .i .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up .i .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .muted{color:var(--muted);font-size:14px;padding:6px}

/* modale */
.backdrop{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.backdrop[hidden]{display:none !important}
.modal{width:100%;max-width:440px;padding:24px;animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.modal h3{font-size:22px;text-transform:capitalize}
.modal .sub{color:var(--muted);font-size:14px;margin:2px 0 14px}
.modal label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 6px}
.modal select,.modal textarea{display:block;width:100%;border:2px solid transparent;background:var(--card-2);border-radius:12px;padding:11px 14px;outline:none}
.modal select:focus,.modal textarea:focus{border-color:var(--mint);background:var(--card)}
.modal textarea{min-height:76px;resize:vertical}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.ex{display:flex;align-items:center;gap:10px;background:var(--card-2);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ex .i{flex:1;min-width:0}
.ex .t{font-weight:700}
.ex .s{font-size:13px;color:var(--muted)}
.ex .rm{color:var(--muted);font-size:13px;font-weight:700;padding:4px 8px;border-radius:8px}
.ex .rm:hover{color:var(--danger);background:var(--danger-soft)}
.hint{font-size:13.5px;color:var(--text);background:var(--sun-soft);border-radius:12px;padding:10px 12px;margin-top:10px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--bar);color:var(--on-bar);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-peak" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" d="M3 20 10 7l4 6 2-3 5 10Z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="m8.2 10.5 1.8 1.5 1.6-1.5"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<header class="hdr">
  <div class="hdr-in">
    <div class="logo" aria-hidden="true"><svg width="22" height="22"><use href="#i-peak"/></svg></div>
    <nav class="tabs">
      <a href="#vette" data-page="vette"><svg width="17" height="17" aria-hidden="true"><use href="#i-peak"/></svg><span>Vette</span></a>
      <a href="#calendario" data-page="calendario"><svg width="17" height="17" aria-hidden="true"><use href="#i-cal"/></svg><span>Calendario</span></a>
    </nav>
    <div class="sync" id="sync" title="Collegamento in corso"><i></i><span id="syncText">Collegamento…</span></div>
  </div>
</header>

<main>
  <section class="page" id="page-vette">
    <div class="page-head">
      <h1>Vette in progetto</h1>
      <div class="tile"><b id="todoCount">0</b>da fare</div>
    </div>

    <form class="card add" id="addForm" autocomplete="off">
      <input class="name" id="aNome" placeholder="Montagna" aria-label="Montagna" required>
      <div class="specs">
        <div class="field"><label for="aQuota">Altezza</label><input type="number" min="0" id="aQuota" placeholder="—"><span>m</span></div>
        <div class="field"><label for="aDisl">D+</label><input type="number" min="0" id="aDisl" placeholder="—"><span>m</span></div>
        <div class="field"><label for="aDist">Distanza</label><input type="number" min="0" step="0.1" id="aDist" placeholder="—"><span>km</span></div>
      </div>
      <button class="btn primary" type="submit">+ Aggiungi</button>
    </form>

    <div class="tasks" id="taskList">
      <div class="empty"><b>Carico le vette…</b>Un attimo, sto leggendo la lista condivisa.</div>
    </div>
  </section>

  <section class="page" id="page-calendario" hidden>
    <div class="page-head">
      <h1>Calendario uscite</h1>
      <p>Clicca un giorno per programmare una salita.</p>
    </div>
    <div class="cal-layout">
      <div class="card cal">
        <div class="cal-head">
          <h2 id="monthLabel"></h2>
          <div class="cal-nav">
            <button class="icon-btn" id="prev" aria-label="Mese precedente"><svg width="18" height="18"><use href="#i-left"/></svg></button>
            <button class="btn soft" id="todayBtn" style="padding:8px 14px">Oggi</button>
            <button class="icon-btn" id="next" aria-label="Mese successivo"><svg width="18" height="18"><use href="#i-right"/></svg></button>
          </div>
        </div>
        <div class="weekdays"><div>Lun</div><div>Mar</div><div>Mer</div><div>Gio</div><div>Ven</div><div>Sab</div><div>Dom</div></div>
        <div class="days" id="days"></div>
      </div>
      <div class="side">
        <div class="card next-hero" id="nextHero" hidden></div>
        <div class="card">
          <h3>In programma</h3>
          <div id="upList"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="backdrop" id="backdrop" hidden>
  <div class="card modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h3 id="mTitle"></h3>
    <div class="sub" id="mSub"></div>
    <div id="mExisting"></div>
    <label for="mMeta" id="mMetaLabel">Vetta</label>
    <select id="mMeta"></select>
    <label for="mNote">Nota</label>
    <textarea id="mNote" placeholder="Ritrovo, orario, chi guida, cosa portare…"></textarea>
    <div class="hint" id="mHint" hidden>Non ci sono vette da fare: aggiungine una nella pagina Vette.</div>
    <div class="actions">
      <button class="btn soft" id="mClose">Chiudi</button>
      <button class="btn primary" id="mSave">Programma</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</body>
</html>
<script>
const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const GIORNI = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y,m-1,d); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n).toLocaleString("it-IT",{maximumFractionDigits:1});
const todayISO = () => iso(new Date());
const shortDate = s => { const d = parse(s); return `${GIORNI[d.getDay()].slice(0,3)} ${d.getDate()} ${MESI[d.getMonth()].slice(0,3)}`; };
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s||""));

/* ---------- stato ---------- */
const state = { mete: [], uscite: [] };
let openTask = null, openDate = null, view = new Date(); view.setDate(1);
let loaded = false;

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2400);
}
function setSync(kind, text){
  const s = $("sync"); s.className = "sync " + kind; $("syncText").textContent = text; s.title = text;
}

/* ---------- archivio condiviso: Supabase ---------- */
const SUPABASE_URL = "https://afptwvzsjfmujxfvybjv.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmcHR3dnpzamZtdWp4ZnZ5Ymp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3Mzg0MjAsImV4cCI6MjEwOTMxNDQyMH0.rgWCi9m-VYXxJalkt5VgWpjF-WhXIsbJBw2WTdpYDmQ";
let sb = null;
const num = v => v == null ? null : Number(v);
function fromRow(col, r){
  if (col === "mete") return { id:r.id, nome:r.nome, quota:num(r.quota), dislivello:num(r.dislivello), distanza:num(r.distanza), nota:r.nota || "", done:!!r.done, creato:Number(r.creato) };
  return { id:r.id, date:r.date, metaId:r.meta_id, titolo:r.titolo || "", nota:r.nota || "", creato:Number(r.creato) };
}
function toRow(col, o){
  const r = {};
  for (const k in o){ if (k === "metaId") r.meta_id = o[k]; else r[k] = o[k]; }
  return r;
}
const store = {
  async add(col, data){
    const id = uid(); const item = { id, ...data };
    state[col].push(item); renderFromStore();
    const { error } = await sb.from(col).insert(toRow(col, item));
    if (error) throw error;
    return id;
  },
  async update(col, id, patch){
    const x = state[col].find(i => i.id === id); if (x) Object.assign(x, patch);
    renderFromStore();
    const { error } = await sb.from(col).update(toRow(col, patch)).eq("id", id);
    if (error) throw error;
  },
  async remove(col, id){
    state[col] = state[col].filter(i => i.id !== id); renderFromStore();
    const { error } = await sb.from(col).delete().eq("id", id);
    if (error) throw error;
  }
};
async function safe(p, msg){
  try{ await p; }
  catch(e){
    toast(msg || "Modifica non salvata: controlla la connessione e riprova.");
    refetch("mete"); refetch("uscite");
  }
}
function sortState(){
  state.mete.sort((a,b) => (b.creato||0) - (a.creato||0));
  state.uscite.sort((a,b) => String(a.date).localeCompare(String(b.date)));
}

/* aggiornamenti in arrivo mentre si sta scrivendo: rimandati a quando si esce dal campo */
let pendingTasks = false;
const editing = () => { const a = document.activeElement; return !!(a && a.closest && a.closest("#taskList") && /INPUT|TEXTAREA/.test(a.tagName)); };
function renderFromStore(){
  sortState();
  if (editing()){ pendingTasks = true; renderCounts(); renderCalendar(); renderSide(); }
  else renderAll();
  if (openDate && !$("backdrop").hidden) renderModalExisting();
}
$("taskList").addEventListener("focusout", () => setTimeout(() => { if (pendingTasks && !editing()){ pendingTasks = false; renderTasks(); } }, 0));

const pendingEdits = () => Object.keys(editTimers).length > 0;
async function refetch(col){
  const { data, error } = await sb.from(col).select("*");
  if (error) throw error;
  if (col === "mete" && pendingEdits()){
    /* non sovrascrivere i campi che si stanno ancora scrivendo */
    const local = Object.fromEntries(state.mete.map(m => [m.id, m]));
    state.mete = data.map(r => { const m = fromRow(col, r); const l = local[m.id];
      if (l) for (const k of Object.keys(editTimers)){ const [id, f] = k.split("|"); if (id === m.id) m[f] = l[f]; }
      return m; });
  } else state[col] = data.map(r => fromRow(col, r));
  loaded = true; renderFromStore();
}
const refetchTimers = {};
function scheduleRefetch(col){
  clearTimeout(refetchTimers[col]);
  refetchTimers[col] = setTimeout(() => refetch(col).catch(() => {}), 150);
}

async function connect(){
  if (!window.supabase || !window.supabase.createClient){
    loaded = true; renderAll(); setSync("", "Non collegato");
    toast("Non riesco a caricare il collegamento al database: ricarica la pagina.");
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:false } });
  const timer = setTimeout(() => { if (!loaded){ loaded = true; renderAll(); setSync("", "Dati non raggiungibili"); toast("Non riesco a raggiungere la lista: controlla la connessione."); } }, 10000);
  try{
    await Promise.all([refetch("mete"), refetch("uscite")]);
    clearTimeout(timer);
    setSync("live", "Condiviso");
  }catch(e){
    clearTimeout(timer); loaded = true; renderAll(); setSync("", "Dati non raggiungibili");
  }
  sb.channel("vette-live")
    .on("postgres_changes", { event:"*", schema:"public", table:"mete" }, () => scheduleRefetch("mete"))
    .on("postgres_changes", { event:"*", schema:"public", table:"uscite" }, () => scheduleRefetch("uscite"))
    .subscribe(status => {
      if (status === "SUBSCRIBED"){ setSync("live", "Condiviso"); scheduleRefetch("mete"); scheduleRefetch("uscite"); }
      else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") setSync("", "Riconnessione…");
    });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible"){ scheduleRefetch("mete"); scheduleRefetch("uscite"); } });
}

/* ---------- navigazione ---------- */
function showPage(page){
  if (page !== "calendario") page = "vette";
  $("page-vette").hidden = page !== "vette";
  $("page-calendario").hidden = page !== "calendario";
  document.querySelectorAll("[data-page]").forEach(a => a.classList.toggle("active", a.dataset.page === page));
  try{ history.replaceState(null, "", "#" + page); }catch(e){}
  try{ window.scrollTo(0,0); }catch(e){}
}
document.querySelectorAll("[data-page]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); showPage(a.dataset.page); }));
window.addEventListener("hashchange", () => showPage(location.hash.slice(1)));

const metaById = id => state.mete.find(m => m.id === id);
const metaName = u => { const m = metaById(u.metaId); return m ? (m.nome || "Senza nome") : (u.titolo || "Vetta eliminata"); };
const nextDateFor = id => state.uscite.filter(u => u.metaId === id && isDate(u.date) && u.date >= todayISO()).map(u => u.date).sort()[0];
const numOrNull = v => v === "" || v == null || isNaN(Number(v)) ? null : Number(v);

/* ---------- vette ---------- */
function renderCounts(){ $("todoCount").textContent = state.mete.filter(m => !m.done).length; }
function renderTasks(){
  renderCounts();
  const el = $("taskList");
  if (!loaded){ return; }
  if (!state.mete.length){
    el.innerHTML = `<div class="empty"><b>Nessuna vetta in lista</b>Scrivi il nome di una montagna qui sopra e premi Aggiungi.</div>`;
    return;
  }
  el.innerHTML = state.mete.map(taskHTML).join("");
}
function taskHTML(m){
  const next = nextDateFor(m.id);
  const pills = [
    m.dislivello != null ? `<span class="pill up">D+ ${fmt(m.dislivello)} m</span>` : "",
    m.distanza != null ? `<span class="pill km">⟷ ${fmt(m.distanza)} km</span>` : "",
    !m.done && next ? `<span class="pill date">📅 ${shortDate(next)}</span>` : ""
  ].join("");
  const open = openTask === m.id;
  return `
  <div class="card task ${m.done?"done":""} ${open?"open":""}" data-id="${esc(m.id)}">
    <div class="task-main">
      <button class="check" data-act="toggle" aria-label="${m.done?"Segna da fare":"Segna come fatta"}"><svg width="16" height="16"><use href="#i-check"/></svg></button>
      <div class="task-body" data-act="expand">
        <div class="task-title"><span class="t">${esc(m.nome) || "<i>Senza nome</i>"}</span>${m.quota != null ? `<span class="quota">▲ ${fmt(m.quota)} m</span>` : ""}</div>
        ${pills ? `<div class="pills">${pills}</div>` : ""}
        ${m.nota ? `<div class="note-preview">${esc(m.nota)}</div>` : ""}
      </div>
      <button class="chev" data-act="expand" aria-label="Modifica"><svg width="18" height="18"><use href="#i-chev"/></svg></button>
    </div>
    <div class="task-edit">
      <div class="edit-grid">
        <div class="field wide"><label for="n-${esc(m.id)}">Nome</label><input id="n-${esc(m.id)}" data-f="nome" value="${esc(m.nome)}"></div>
        <div class="field"><label for="q-${esc(m.id)}">Altezza</label><input id="q-${esc(m.id)}" type="number" min="0" data-f="quota" value="${m.quota ?? ""}" placeholder="—"><span>m</span></div>
        <div class="field"><label for="d-${esc(m.id)}">D+</label><input id="d-${esc(m.id)}" type="number" min="0" data-f="dislivello" value="${m.dislivello ?? ""}" placeholder="—"><span>m</span></div>
        <div class="field"><label for="k-${esc(m.id)}">Distanza</label><input id="k-${esc(m.id)}" type="number" min="0" step="0.1" data-f="distanza" value="${m.distanza ?? ""}" placeholder="—"><span>km</span></div>
      </div>
      <textarea id="t-${esc(m.id)}" data-f="nota" aria-label="Nota" placeholder="Note: punto di partenza, rifugio, condizioni, cosa portare…">${esc(m.nota)}</textarea>
      <div class="edit-actions">
        ${m.done ? "" : `<button class="btn soft" data-act="plan">📅 Programma uscita</button>`}
        <span class="spacer"></span>
        <button class="btn danger" data-act="delete">Elimina</button>
        <button class="btn soft" data-act="expand">Chiudi</button>
      </div>
    </div>
  </div>`;
}

$("addForm").addEventListener("submit", e => {
  e.preventDefault();
  const nome = $("aNome").value.trim(); if (!nome) return;
  const data = { nome, quota:numOrNull($("aQuota").value), dislivello:numOrNull($("aDisl").value), distanza:numOrNull($("aDist").value), nota:"", done:false, creato:Date.now() };
  e.target.reset(); $("aNome").focus();
  safe(store.add("mete", data));
  toast(`${nome} aggiunta alla lista`);
});

/* modifiche nei campi: un salvataggio per pausa di scrittura */
const editTimers = {};
function queueEdit(id, f, val){
  const k = id + "|" + f;
  clearTimeout(editTimers[k]);
  editTimers[k] = setTimeout(() => { delete editTimers[k]; safe(store.update("mete", id, {[f]: val})); }, 600);
}
const taskList = $("taskList");
taskList.addEventListener("input", e => {
  const f = e.target.dataset.f; if (!f) return;
  const id = e.target.closest(".task").dataset.id;
  const val = e.target.type === "number" ? numOrNull(e.target.value) : e.target.value;
  const m = metaById(id); if (m) m[f] = val;
  queueEdit(id, f, val);
});
let armedDelete = null;
taskList.addEventListener("click", e => {
  const actEl = e.target.closest("[data-act]"); if (!actEl) return;
  const card = actEl.closest(".task"); const m = metaById(card.dataset.id); if (!m) return;
  const act = actEl.dataset.act;
  if (act === "toggle"){
    m.done = !m.done; renderAll();
    safe(store.update("mete", m.id, {done: m.done}));
  } else if (act === "expand"){
    openTask = openTask === m.id ? null : m.id; renderTasks();
  } else if (act === "delete"){
    if (armedDelete !== m.id){
      armedDelete = m.id; actEl.classList.add("armed"); actEl.textContent = "Tocca di nuovo per eliminare";
      setTimeout(() => { if (armedDelete === m.id){ armedDelete = null; actEl.classList.remove("armed"); actEl.textContent = "Elimina"; } }, 3500);
      return;
    }
    armedDelete = null; openTask = null;
    const nome = m.nome;
    state.uscite.filter(u => u.metaId === m.id).forEach(u => safe(store.update("uscite", u.id, {metaId:null, titolo:nome})));
    safe(store.remove("mete", m.id));
    toast(`${nome || "Vetta"} eliminata`);
  } else if (act === "plan"){
    showPage("calendario"); openDay(nextSaturday(), m.id);
  }
});
function nextSaturday(){ const d = new Date(); d.setDate(d.getDate() + (6 - d.getDay() + 7) % 7); return iso(d); }

/* ---------- calendario ---------- */
function renderCalendar(){
  $("monthLabel").textContent = `${MESI[view.getMonth()]} ${view.getFullYear()}`;
  const first = new Date(view.getFullYear(), view.getMonth(), 1);
  const start = new Date(first); start.setDate(1 - (first.getDay()+6)%7);
  const today = todayISO();
  let html = "";
  for (let i = 0; i < 42; i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    if (i >= 35 && d.getMonth() !== view.getMonth()) break;
    const key = iso(d);
    const cls = ["day"];
    if (d.getMonth() !== view.getMonth()) cls.push("out");
    if (key === today) cls.push("today");
    if (key < today) cls.push("past");
    if (d.getDay() === 0 || d.getDay() === 6) cls.push("weekend");
    const evs = state.uscite.filter(u => u.date === key).map(u => {
      const m = metaById(u.metaId);
      return `<div class="ev ${m && m.done ? "done" : ""}" title="${esc(metaName(u))}">${esc(metaName(u))}</div>`;
    }).join("");
    html += `<div class="${cls.join(" ")}" data-date="${key}" role="button" tabindex="0" aria-label="${d.getDate()} ${MESI[d.getMonth()]}"><div class="n">${d.getDate()}</div>${evs}</div>`;
  }
  $("days").innerHTML = html;
}
$("days").addEventListener("click", e => { const d = e.target.closest(".day"); if (d) openDay(d.dataset.date); });
$("days").addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("day")){ e.preventDefault(); openDay(e.target.dataset.date); } });
$("prev").onclick = () => { view.setMonth(view.getMonth()-1); renderCalendar(); };
$("next").onclick = () => { view.setMonth(view.getMonth()+1); renderCalendar(); };
$("todayBtn").onclick = () => { view = new Date(); view.setDate(1); renderCalendar(); };

function renderSide(){
  const today = todayISO(), t0 = parse(today);
  const up = state.uscite.filter(u => isDate(u.date) && u.date >= today);
  const hero = $("nextHero");
  if (up.length){
    const u = up[0], d = parse(u.date), m = metaById(u.metaId);
    const diff = Math.round((d - t0)/86400000);
    const cd = diff === 0 ? "È oggi, buona salita" : diff === 1 ? "Domani" : `Mancano ${diff} giorni`;
    const specs = m ? [m.quota != null && `${fmt(m.quota)} m`, m.dislivello != null && `D+ ${fmt(m.dislivello)} m`, m.distanza != null && `${fmt(m.distanza)} km`].filter(Boolean).join(" · ") : "";
    hero.innerHTML = `<svg width="150" height="90" viewBox="0 0 150 90" aria-hidden="true"><path d="M0 90 50 20l25 32 18-20 57 58Z" fill="currentColor"/></svg>
      <small>Prossima uscita</small><div class="big">${esc(metaName(u))}</div>
      <div class="when">${GIORNI[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]}${specs ? `<br><span style="opacity:.85;font-weight:500">${specs}</span>` : ""}</div>
      <span class="countdown">${cd}</span>`;
    hero.hidden = false;
    hero.onclick = () => { openDay(u.date); };
  } else { hero.hidden = true; hero.innerHTML = ""; hero.onclick = null; }
  const rest = up.slice(1, 7);
  $("upList").innerHTML = rest.length ? rest.map(u => {
    const d = parse(u.date);
    return `<div class="up" data-date="${u.date}" role="button" tabindex="0"><div class="d"><b>${d.getDate()}</b><small>${MESI[d.getMonth()].slice(0,3)}</small></div>
      <div class="i"><div class="t">${esc(metaName(u))}</div><div class="s">${esc(u.nota) || GIORNI[d.getDay()]}</div></div></div>`;
  }).join("") : `<div class="muted">${up.length ? "Nient'altro dopo la prossima uscita." : "Nessuna uscita in programma. Clicca un giorno del calendario."}</div>`;
}
$("upList").addEventListener("click", e => { const r = e.target.closest(".up"); if (r) openDay(r.dataset.date); });

/* ---------- finestra del giorno ---------- */
function renderModalExisting(){
  const items = state.uscite.filter(u => u.date === openDate);
  $("mSub").textContent = items.length ? "Già in programma:" : "Che vetta volete salire?";
  $("mExisting").innerHTML = items.map(u => `<div class="ex"><div class="i"><div class="t">${esc(metaName(u))}</div>${u.nota ? `<div class="s">${esc(u.nota)}</div>` : ""}</div><button class="rm" data-rm="${esc(u.id)}">Rimuovi</button></div>`).join("");
}
function openDay(key, preselect){
  openDate = key;
  const d = parse(key);
  view = new Date(d.getFullYear(), d.getMonth(), 1); renderCalendar();
  $("mTitle").textContent = `${GIORNI[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]}`;
  renderModalExisting();
  const options = state.mete.filter(m => (m.nome||"").trim() && (!m.done || m.id === preselect));
  $("mMeta").innerHTML = options.map(m => `<option value="${esc(m.id)}" ${m.id===preselect?"selected":""}>${esc(m.nome)}</option>`).join("");
  const none = !options.length;
  $("mMeta").hidden = none; $("mMetaLabel").hidden = none; $("mHint").hidden = !none; $("mSave").disabled = none;
  $("mNote").value = "";
  $("backdrop").hidden = false;
  setTimeout(() => (none ? $("mClose") : $("mMeta")).focus(), 30);
}
function closeModal(){ $("backdrop").hidden = true; openDate = null; }
$("mClose").onclick = closeModal;
$("backdrop").addEventListener("click", e => { if (e.target === $("backdrop")) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("backdrop").hidden) closeModal(); });
$("mSave").onclick = () => {
  const metaId = $("mMeta").value; if (!metaId || !openDate) return;
  safe(store.add("uscite", { date:openDate, metaId, titolo:"", nota:$("mNote").value.trim(), creato:Date.now() }));
  closeModal(); toast("Uscita programmata");
};
$("mExisting").addEventListener("click", e => {
  const id = e.target.dataset.rm; if (!id) return;
  safe(store.remove("uscite", id));
});

function renderAll(){ renderTasks(); renderCalendar(); renderSide(); }
showPage(location.hash.slice(1));
renderCalendar(); renderSide(); renderCounts();
connect();
</script>
</body>
</html>
